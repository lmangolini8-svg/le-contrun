stroke-width="1.4"/><text x="0" y="4" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D</text></g><g transform="translate(92,96)"><circle r="9" fill="#253d42" stroke="#fff7df" stroke-width="1.4"/><text x="0" y="4" font-size="11" font-weight="bold" fill="white" text-anchor="middle">E</text></g><g transform="translate(132,281)"><circle r="9" fill="#253d42" stroke="#fff7df" stroke-width="1.4"/><text x="0" y="4" font-size="11" font-weight="bold" fill="white" text-anchor="middle">F</text></g><g transform="translate(203,548)"><circle r="9" fill="#253d42" stroke="#fff7df" stroke-width="1.4"/><text x="0" y="4" font-size="11" font-weight="bold" fill="white" text-anchor="middle">G</text></g><g transform="translate(342,386)"><circle r="9" fill="#253d42" stroke="#fff7df" stroke-width="1.4"/><text x="0" y="4" font-size="11" font-weight="bold" fill="white" text-anchor="middle">H</text></g><text x="243" y="454" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Atelier</text><text x="341" y="445" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Place</text><text x="380" y="466" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Quai</text><text x="104" y="456" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Pont / lavoir</text><text x="460" y="456" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Cour des gardes</text><text x="466" y="320" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Cathédrale</text><text x="525" y="311" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Chevet</text><text x="470" y="398" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Parvis</text><text x="318" y="337" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Palais</text><text x="157" y="315" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Notables</text><text x="142" y="241" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Bifurcation</text><text x="117" y="119" text-anchor="end" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Source et cabane</text><text x="479" y="122" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Clos conventuel</text><text x="207" y="579" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Faubourg sud</text><text x="288" y="518" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Maisons de rive</text><text x="140" y="413" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Tanneurs</text><text x="107" y="270" text-anchor="end" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Porte forestière</text><text x="302" y="167" text-anchor="middle" fill="#233c40" stroke="#fff9e9" stroke-width="3.3" paint-order="stroke" font-size="11.5" font-weight="bold">Chemin des vergers</text></g><path stroke="#c8bfaa" d="M592 100V690"/><text x="620" y="118" font-size="21" font-weight="bold" fill="#293e40" text-anchor="start">Accès et progression</text><text x="620" y="151" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">A</text><text x="668" y="151" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Poterne et cour des gardes</text><text x="668" y="171" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Acte I : la grille s’ouvre à partir de l’étape 3.</text><text x="668" y="188" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">À l’acte II, le code maintient la grille fermée.</text><text x="620" y="224" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">B</text><text x="668" y="224" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Parvis et nef</text><text x="668" y="244" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Acte I prévu : entrée publique par le parvis.</text><text x="668" y="261" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Le cloître donne sur le chevet par la porte latérale.</text><text x="620" y="297" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">C</text><text x="668" y="297" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Cimetière en terrasses</text><text x="668" y="317" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Deux accès projetés : rue du chapitre ou cloître.</text><text x="668" y="334" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Acte II : Guillemette conduit Aliénor au chevet.</text><text x="620" y="370" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">D</text><text x="668" y="370" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Portail du couvent</text><text x="668" y="390" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Église et parloir accueillent les visiteurs.</text><text x="668" y="407" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Acte III : cloître et verger en visite accompagnée.</text><text x="620" y="443" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">E</text><text x="668" y="443" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Cabane de Mahaut</text><text x="668" y="463" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Acte IV : suivre le sentier de la lisière à la source.</text><text x="668" y="480" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Le carnet révèle le refuge lors de la rencontre.</text><text x="620" y="516" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">F–G</text><text x="668" y="516" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Les deux portes de ville</text><text x="668" y="536" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">F dessert le couvent et les bois. G relie la rive sud</text><text x="668" y="553" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">au faubourg. Le pont et la porte sont deux seuils.</text><text x="620" y="589" font-size="13" font-weight="bold" fill="#966445" text-anchor="start">H</text><text x="668" y="589" font-size="16" font-weight="bold" fill="#293e40" text-anchor="start">Portail du palais et niveaux</text><text x="668" y="609" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Cour d’honneur derrière le portail. Archives et</text><text x="668" y="626" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">oubliettes demandent un accès narratif distinct.</text><path d="M36 705H1083" stroke="#c8bfaa"/><path d="M38 727h40" fill="none" stroke="#fffaf0" stroke-width="7"/><path d="M38 727h40" fill="none" stroke="#26787a" stroke-width="3.8" /><text x="87" y="732" font-size="12" font-weight="bold" fill="#293e40" text-anchor="start">Circulation publique prévue</text><path d="M369 727h40" fill="none" stroke="#fffaf0" stroke-width="7"/><path d="M369 727h40" fill="none" stroke="#965525" stroke-width="3.8" stroke-dasharray="7 4"/><text x="418" y="732" font-size="12" font-weight="bold" fill="#293e40" text-anchor="start">Seuil gardé, privé ou accompagné</text><path d="M778 727h40" fill="none" stroke="#fffaf0" stroke-width="7"/><path d="M778 727h40" fill="none" stroke="#704e83" stroke-width="3.8" stroke-dasharray="2 5"/><text x="827" y="732" font-size="12" font-weight="bold" fill="#293e40" text-anchor="start">Sentier découvert à l’acte IV</text><text x="36" y="757" font-size="12" font-weight="normal" fill="#293e40" text-anchor="start">Poterne : état relevé dans le code de la branche des planches. Les autres tracés représentent des raccords de conception.</text><text x="36" y="777" font-size="12" font-weight="normal" fill="#52665d" text-anchor="start">Schéma sans échelle. Distances, escaliers et traversées restent à vérifier dans la scène 3D sur iPad.</text></g></svg>
