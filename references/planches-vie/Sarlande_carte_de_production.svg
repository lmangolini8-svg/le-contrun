" font-size="16" font-weight="bold">Quartiers et abords</text><text x="570" y="119" font-size="14"><tspan font-weight="bold">1. </tspan>Place du marché et fontaine</text><text x="570" y="146" font-size="14"><tspan font-weight="bold">2. </tspan>Rue de l’imprimerie et atelier</text><text x="570" y="173" font-size="14"><tspan font-weight="bold">3. </tspan>Palais, cour d’honneur et colosse</text><text x="570" y="200" font-size="14"><tspan font-weight="bold">4. </tspan>Jardins du palais</text><text x="570" y="227" font-size="14"><tspan font-weight="bold">5. </tspan>Poterne, gardes et chapelle</text><text x="570" y="254" font-size="14"><tspan font-weight="bold">6. </tspan>Parvis et quartier du chapitre</text><text x="570" y="281" font-size="14"><tspan font-weight="bold">7. </tspan>Hôtels des notables</text><text x="570" y="308" font-size="14"><tspan font-weight="bold">8. </tspan>Tanneurs et bras de rivière</text><text x="570" y="335" font-size="14"><tspan font-weight="bold">9. </tspan>Quai, entrepôt et lavoir</text><text x="570" y="362" font-size="14"><tspan font-weight="bold">10. </tspan>Maisons de la rive sud</text><text x="570" y="389" font-size="14"><tspan font-weight="bold">11. </tspan>Îlots d’habitation à l’est</text><text x="570" y="416" font-size="14"><tspan font-weight="bold">12. </tspan>Cimetière du chevet</text><text x="570" y="443" font-size="14"><tspan font-weight="bold">13. </tspan>Bois, lisière et sentiers</text><text x="570" y="470" font-size="14"><tspan font-weight="bold">14. </tspan>Couvent, clos et jardins</text><text x="570" y="497" font-size="14"><tspan font-weight="bold">15. </tspan>Exil de Mahaut et source</text><text x="570" y="524" font-size="14"><tspan font-weight="bold">16. </tspan>Faubourg, champs et vignes</text><text x="38" y="672" font-size="13">Tirets ocre : chemin du couvent et route du sud. Pointillé vert : sentier de la source.</text><text x="38" y="696" font-size="13">Le carnet révèle le refuge à la rencontre de l’acte IV. Distances à recaler sur la scène 3D.</text></g></svg>
