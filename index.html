<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Le Contr’un</title>
<style>
@font-face{font-family:'Caveat';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/caveat-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Caveat';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/caveat-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'IM Fell Double Pica';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/im-fell-double-pica-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IM Fell Double Pica';font-weight:400;font-style:italic;font-display:swap;src:url('fonts/im-fell-double-pica-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'IM Fell Double Pica SC';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/im-fell-double-pica-sc-latin-400-normal.woff2') format('woff2')}
:root{
  /* Un carnet d'aquarelliste : papier blanc cassé, encre de Chine, indigo, bleu pétrole, sauge, ocre, sienne, orange lumineux.
     Mise en page : la peinture occupe la feuille, l'interface est écrite à la plume dans ses marges. */
  --paper:#f3ecdd; --page:#f7f1e3; --ink:#221f2b; --indigo:#2e3a66; --petrole:#2f6b78; --sienne:#a9583a; --orange:#e07f2a; --muted:#6a6470;
  --display:"IM Fell Double Pica","Iowan Old Style",Georgia,serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--display);touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px dashed var(--sienne);outline-offset:3px}
/* trait de plume irrégulier */
.cart{background:var(--page);border:1.6px solid var(--ink);border-radius:255px 14px 225px 16px/14px 225px 16px 255px;box-shadow:2px 3px 0 rgba(34,31,43,.08)}

#fg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fg svg{position:absolute;overflow:visible}
#fg .tr{right:-8px;top:-8px;width:min(52vw,470px)}
#fg .tl{left:-8px;top:-8px;width:min(32vw,290px)}
#fg .bl{left:-8px;bottom:-6px;width:min(36vw,300px)}
#fg .sway{transform-box:fill-box;transform-origin:100% 0;animation:sway 7s ease-in-out infinite alternate}
#fg .reed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}

#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#obj{position:absolute;left:22px;top:20px;max-width:min(60vw,350px);padding:8px 16px 10px;font-family:var(--hand);font-size:20px;line-height:1.1;transform:rotate(-0.6deg)}
#obj b{display:block;font-family:var(--display);font-style:italic;font-weight:400;font-size:15px;color:var(--sienne);margin-bottom:2px}
#carnetBtn{position:absolute;right:22px;top:20px;padding:8px 14px;font-family:var(--hand);font-weight:700;font-size:22px;min-height:48px;display:flex;align-items:center;gap:8px;transform:rotate(0.8deg)}
#carnetBtn svg{width:30px;height:26px}
#snd{position:fixed;right:22px;top:20px;width:50px;height:50px;padding:9px;z-index:6;transition:top .3s}
#snd svg{width:100%;height:100%;display:block}
#arrow{position:absolute;left:50%;top:104px;width:44px;height:44px;margin-left:-22px;pointer-events:none;transition:opacity .3s}
#arrowLab{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-family:var(--hand);font-weight:700;font-size:19px;color:var(--ink);background:rgba(247,241,227,.86);padding:0 10px;border-radius:12px;white-space:nowrap;pointer-events:none;transition:opacity .3s;opacity:0}
#daze{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:92px;height:57px;opacity:0;transition:opacity .25s;pointer-events:none}
#seen{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:84px;height:52px;opacity:0;transition:opacity .25s;pointer-events:none}
#joy{position:absolute;width:124px;height:124px;display:none;pointer-events:none}
#joy svg{position:absolute;inset:0;width:100%;height:100%}
#joy i{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;background:var(--ink);opacity:.82}
#act{position:absolute;right:26px;bottom:38px;width:118px;height:118px;border-radius:47% 53% 50% 50%/52% 48% 54% 46%;background:rgba(247,241,227,.9);border:3px solid var(--ink);box-shadow:inset 0 0 0 5px rgba(247,241,227,.9),inset 0 0 0 6.5px var(--ink);font-family:var(--hand);font-weight:700;font-size:22px;line-height:1;padding:12px;display:none;color:var(--ink)}
#say{position:absolute;left:50%;top:190px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 40px));text-align:center;font-family:var(--hand);font-size:22px;line-height:1.15;color:var(--ink);background:rgba(247,241,227,.92);padding:4px 14px;border-radius:14px;opacity:0;transition:opacity .4s;pointer-events:none}
.temo{border-top:1px dashed rgba(34,31,43,.35);padding-top:10px;display:grid;gap:6px}
.temo.lock{color:var(--muted);font-family:var(--hand);font-size:19px}
.temo b{font-size:18px;font-weight:400;font-style:italic}
.temo p{margin:0;font-size:17px;line-height:1.35}
.temo .cause{color:var(--petrole)}
.causes{display:flex;flex-wrap:wrap;gap:6px}
.causes button{font-family:var(--hand);font-weight:700;font-size:18px;padding:5px 12px;min-height:42px;border:1.3px solid var(--ink);border-radius:14px 225px 16px 255px/225px 16px 255px 14px;background:var(--page)}
#hint{position:absolute;left:24px;bottom:22px;font-family:var(--hand);font-size:19px;color:var(--muted);pointer-events:none;max-width:55vw}

#dlg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,calc(100vw - 36px));padding:16px 22px 14px;display:none;max-height:72vh;overflow:auto}
#dlg .who{font-family:var(--hand);font-weight:700;font-size:21px;color:var(--sienne)}
#dlg .txt{font-size:21px;line-height:1.3;margin:2px 0 0}
#dlg .txt.narr{font-style:italic}
#dlg .more{font-family:var(--hand);font-size:17px;color:var(--muted);margin-top:8px}
#dlg .ch{display:grid;gap:10px;margin-top:12px}
#dlg .ch button{text-align:left;background:var(--paper);border:1.4px solid var(--ink);border-radius:14px 225px 16px 255px/225px 16px 255px 14px;padding:12px 16px;font-size:18px;line-height:1.25;min-height:48px}
#dlg .feu .cit{font-style:italic;font-size:23px;line-height:1.25;border-left:3px solid var(--orange);padding-left:12px;margin-top:6px}
#dlg .feu .idee{font-family:var(--hand);font-size:20px;margin-top:10px;line-height:1.15}
.pips{display:flex;gap:8px;margin:6px 0 2px}
.pips i{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:52% 48% 55% 45%/45% 55% 48% 52%}
.pips i.on{background:var(--indigo)}

#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:20px;overflow:auto;touch-action:pan-y}
#ov.full{align-items:flex-start;background:rgba(243,236,221,.9)}
#ov.home{flex-direction:column;justify-content:space-between;align-items:center;padding:0;background:linear-gradient(#f3ecdd 0,rgba(243,236,221,.94) 15%,rgba(243,236,221,0) 40%,rgba(243,236,221,0) 56%,rgba(243,236,221,.93) 80%,#f3ecdd 100%)}
.home .top{text-align:center;padding:max(22px,4vh) 20px 0;display:grid;justify-items:center;gap:2px}
.home .by{font-family:var(--hand);font-size:clamp(17px,2.6vw,22px);color:var(--muted)}
#ov.home h1{font-family:"IM Fell Double Pica SC",var(--display);font-size:clamp(58px,14.5vw,124px);line-height:.9;letter-spacing:.03em;margin:0;text-shadow:0 0 22px #f3ecdd,0 0 22px #f3ecdd}
.home .le{font-family:"IM Fell Double Pica SC",var(--display);font-size:clamp(26px,6vw,50px);line-height:1;letter-spacing:.08em;margin-bottom:-4px;text-shadow:0 0 14px #f3ecdd}
.home .sub{font-style:italic;font-size:clamp(20px,3.4vw,28px);line-height:1.1;text-shadow:0 0 10px #f3ecdd,0 0 10px #f3ecdd}
.home .top{position:relative}
.embleme-un{position:absolute;left:50%;top:6px;width:clamp(120px,24vw,210px);transform:translateX(-50%);opacity:.13;pointer-events:none;z-index:-1}
.home .fleuron{width:min(250px,60vw);height:auto;margin-top:4px}
.home .act{font-style:italic;font-size:clamp(19px,3vw,24px);color:var(--sienne)}
.home .bot{display:grid;justify-items:center;gap:12px;padding:0 22px max(20px,3.5vh);text-align:center;width:min(600px,100%)}
#ov.home .pitch{font-size:clamp(17px,2.4vw,20px);line-height:1.32;margin:0;text-wrap:balance;background:rgba(243,236,221,.88);box-shadow:0 0 14px 14px rgba(243,236,221,.88);border-radius:18px}
.home .sec{background:var(--page)}
.home .act,.home .by{text-shadow:0 0 8px #f3ecdd,0 0 8px #f3ecdd,0 0 14px #f3ecdd}
.home .pri{font-size:26px;padding:14px 34px}
.home .row{justify-content:center}
@keyframes titleIn{from{opacity:0;letter-spacing:.14em}to{opacity:1;letter-spacing:.03em}}
#ov.home h1{animation:titleIn 2.2s ease-out both}
.home .bot{animation:capIn2 1.2s 1.2s ease-out both}
@keyframes capIn2{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#ov.home h1,.home .bot{animation:none}}
#ov .box{width:min(620px,100%);padding:22px 26px;display:grid;gap:14px}
#ov.full .box{background:repeating-linear-gradient(var(--page),var(--page) 31px,rgba(46,58,102,.13) 32px);border-radius:6px 14px 8px 12px/12px 8px 14px 6px}
#ov h1{font-weight:400;font-size:clamp(38px,10vw,58px);line-height:1;margin:0;text-wrap:balance}
#ov h2{font-weight:400;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
#ov p{margin:0;font-size:18px;line-height:1.4}
#ov .lede{font-size:21px;line-height:1.3}
.kick{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--sienne)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.pri{background:var(--ink);color:var(--page);padding:13px 24px;font-family:var(--hand);font-weight:700;font-size:23px;min-height:52px;border-radius:255px 18px 225px 20px/20px 225px 18px 255px}
.sec{border:1.5px solid var(--ink);padding:12px 20px;font-family:var(--hand);font-weight:700;font-size:22px;min-height:52px;border-radius:18px 225px 20px 255px/225px 20px 255px 18px}
.feuil{background:var(--paper);border:1.3px solid var(--ink);border-radius:4px 12px 6px 10px/10px 6px 12px 4px;padding:14px 16px;display:grid;gap:8px;transform:rotate(-0.3deg)}
.feuil:nth-child(odd){transform:rotate(0.4deg)}
.feuil.lock{border-style:dashed;color:var(--muted);background:transparent;font-family:var(--hand);font-size:20px}
.feuil .cit{font-style:italic;font-size:21px;line-height:1.25}
.feuil label{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--sienne)}
.feuil textarea{width:100%;min-height:70px;font-family:var(--hand);font-size:20px;padding:6px 8px;border:0;border-bottom:1.3px solid var(--ink);background:transparent;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
#plate{position:fixed;inset:0;display:none;cursor:pointer}
#plate .num{position:absolute;left:50%;top:26px;transform:translateX(-50%);font-family:var(--hand);font-size:20px;color:var(--sienne);background:var(--page);padding:2px 16px;border:1.3px solid var(--ink);border-radius:225px 14px 255px 16px/16px 255px 14px 225px;white-space:nowrap}
#plate .cap{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(620px,calc(100vw - 40px));padding:14px 24px 12px;text-align:center;animation:capIn .9s ease-out both}
#plate .quote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 48px));text-align:center;display:grid;justify-items:center;gap:8px;padding:26px 18px;background:radial-gradient(ellipse at center,rgba(243,236,221,.95) 45%,rgba(243,236,221,0) 72%);animation:capIn2 1.2s ease-out both}
#plate .quote .embleme-un{position:static;transform:none;opacity:.22;width:86px}
#plate .qq{font-style:italic;font-size:clamp(26px,5.4vw,42px);line-height:1.18;margin:0;text-wrap:balance}
#plate .qa{font-family:"IM Fell Double Pica SC",var(--display);letter-spacing:.12em;font-size:clamp(16px,2.6vw,21px)}
#plate .quote .fleuron{width:200px;height:auto}
#plate .lab{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
#plate h2{font-weight:400;font-size:clamp(28px,6.4vw,42px);line-height:1.05;margin:2px 0 8px;text-wrap:balance;animation:nameIn 1.3s .35s ease-out both}
#plate .q{font-style:italic;font-size:19px;line-height:1.3;margin:0}
#plate .src{font-family:var(--hand);font-size:17px;color:var(--muted);margin:2px 0 0}
#plate .rep{font-family:var(--hand);font-size:20px;line-height:1.15;margin:0}
#plate .rep b{color:var(--sienne)}
#plate .ind{height:44px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--hand);font-size:20px;color:var(--sienne)}
#plate .ind svg{width:38px;height:38px}
#plate .ind circle{stroke-dasharray:101;animation:inkRing 1.8s ease-in-out infinite}
#plate .go{animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes capIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes nameIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -5% 0 0)}}
@keyframes inkRing{0%{stroke-dashoffset:101}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-101}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#plate .cap,#plate h2,#plate .ind circle,#plate .go{animation:none}}
.small{font-family:var(--hand);font-size:18px;color:var(--muted)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pl button{text-align:left;font-family:var(--hand);font-size:20px;line-height:1.1;padding:8px 12px;min-height:46px;border:1.3px solid var(--ink);border-radius:14px 225px 16px 255px/225px 16px 255px 14px;background:var(--page)}
.pl button i{font-family:var(--display);font-style:normal;color:var(--sienne);margin-right:4px}
.map{width:100%;height:auto;display:block}
.map text{font-family:var(--hand);font-size:11px;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){#fg .sway,#fg .reed{animation:none}}
#ov.home{background:#ead7b6 url("img/lieux/couverture.webp") center center/cover no-repeat;justify-content:space-around;color:#2d2630}
#ov.home .top{padding:3vh 16px 0}
#ov.home .bot{padding:12px 16px 16px;background:rgba(247,235,211,.94);border:1px solid #997b50;box-shadow:0 2px 12px #38243638;width:min(530px,92vw);gap:8px}
#ov.home .pitch{background:transparent;box-shadow:none}
#ov.home .small{margin:0}
#ov.home .pri,#dlg .ch button:focus-visible{background:#263448;color:#fff2d5}
#plate{background-position:center;background-size:cover;background-repeat:no-repeat}
#dlg{background-color:#f6ead2;border-color:#826647;color:#312936}
#fg{opacity:.38} #fg .tr,#fg .tl{max-width:14vw} #fg .bl{max-width:9vw} #dlg .effigie{float:left;width:clamp(64px,14vw,110px);height:auto;aspect-ratio:1;margin:0 16px 6px 0;border:1px solid #9e8158;box-shadow:0 1px 3px #45352438;border-radius:2px}
#dlg .txt{font-family:var(--display),Georgia,serif}
#dlg .who{color:#794021}
@media(max-width:600px){#ov.home{background-position:49% center}#ov.home .top{background:radial-gradient(ellipse,#f4e4c7e8 40%,transparent 74%)}#dlg{padding:12px 14px}#dlg .effigie{margin-right:10px}#dlg .txt{font-size:18px}}
@media(max-height:500px){#ov.home{flex-direction:row;justify-content:space-evenly;gap:8px}#ov.home .top,#ov.home .bot{max-width:47vw}#ov.home h1{font-size:clamp(42px,9vw,75px)}#ov.home .le{font-size:25px}#ov.home .bot{gap:4px}#dlg .effigie{width:68px}#dlg{bottom:6px}}
@media (max-width:600px) and (orientation:portrait){
  #obj{font:16px/1.22 var(--display);width:calc(100vw - 137px);max-width:245px;padding:7px 11px;transform:none}
  #obj b{font-size:13px;letter-spacing:.02em}
  #obj,#snd,#carnetBtn{border:1px solid #816e57;border-radius:4px;box-shadow:0 2px 8px #44341f24}
}
#cutSkip{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:max(18px,env(safe-area-inset-right));z-index:8;min-height:44px;padding:8px 16px;border-radius:3px;font-size:17px}
#cutPlace{position:fixed;bottom:max(9%,36px);left:6%;color:#fff1cf;text-shadow:0 1px 4px #272331,0 0 12px #272331;font:italic clamp(23px,4vw,44px) var(--display);pointer-events:none}
#cutPlace small{display:block;font:normal .48em var(--display);letter-spacing:.07em}
#cutSkip[hidden],#cutPlace[hidden]{display:none}
#ov .qualityStart{font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;min-height:36px}
@media(max-height:580px){#ov.home .small{display:block;font-size:13px;margin:0}#ov.home .qualityStart{min-height:26px}#ov.home .pitch{font-size:15px;margin:4px 0}#ov.home .bot{gap:4px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fg" aria-hidden="true"></div>
<div id="hud">
  <div id="obj" class="cart"></div>
  <button id="carnetBtn" class="cart"></button>
  <svg id="arrow" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 4 C24 12 30 22 37 31 C31 29 26 29 22 33 C18 29 13 29 7 31 C14 22 20 12 22 4 Z" fill="#e07f2a" stroke="#221f2b" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <svg id="seen" viewBox="0 0 84 52" aria-hidden="true"><path d="M5 27 C22 6 62 6 79 27 C62 46 22 46 5 27 Z" fill="#f7f1e3" stroke="#221f2b" stroke-width="2.4" stroke-linejoin="round"/><circle id="pupil" cx="42" cy="27" r="3" fill="#2e3a66"/><path d="M14 12 L9 5 M30 6 L28 0 M54 6 L56 0 M70 12 L75 5" stroke="#221f2b" stroke-width="2" stroke-linecap="round"/></svg>
  <div id="arrowLab"></div>
  <svg id="daze" viewBox="0 0 84 52" aria-hidden="true"><path d="M8 20 C8 8 30 6 42 14 C54 6 76 8 76 20 C76 36 62 44 52 38 C48 36 44 32 42 32 C40 32 36 36 32 38 C22 44 8 36 8 20 Z" fill="#f7f1e3" stroke="#221f2b" stroke-width="2.4" stroke-linejoin="round"/><path id="dazeP" d="M14 21 C14 12 28 11 40 17 C36 26 26 33 18 30 C15 28 14 25 14 21 M70 21 C70 12 56 11 44 17 C48 26 58 33 66 30 C69 28 70 25 70 21" fill="none" stroke="#e07f2a" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
  <div id="say"></div>
  <div id="hint"></div>
  <div id="joy"><svg viewBox="0 0 124 124"><path d="M62 5 C96 4 120 30 119 62 C118 96 94 120 61 119 C28 118 4 94 5 61 C6 30 30 6 62 5 Z" fill="rgba(247,241,227,.4)" stroke="#221f2b" stroke-width="2.2"/></svg><i></i></div>
  <button id="act"></button>
  <div id="dlg" class="cart"></div>
</div>
<div id="plate" role="button" tabindex="0"></div>
<div id="ov"></div>
<button id="snd" class="cart"></button>
<div id="cutPlace" hidden>Sarlande<small>Le matin du tribut</small></div>
<button id="cutSkip" class="cart" hidden>Passer la scène</button>

<script src="vendor/three.r128.min.js"></script>
<script>
"use strict";
/* ================= Textes ================= */
const FEU = {
  F1:{cit:"« tant d’hommes, tant de bourgs, tant de villes, tant de nations »", idee:"L’étonnement de départ : une multitude immense supporte un homme seul, qui n’a de puissance que celle qu’elle lui donne."},
  F2:{cit:"« […] appellerons-nous cela lâcheté ? »", idee:"La Boétie écarte l’explication par la peur. Que des milliers n’osent rien contre un seul, cela ne peut pas s’appeler lâcheté : il faut chercher une autre cause."},

  const [,W,Df,Db,pa]=aliSkirtAt(y),s=Math.sin(a),c=Math.cos(a);

  const r=1+(fold+off)/Math.max(.1,Math.hypot(W*s,(c>0?Df:Db)*c));
  return [W*s*r,y,(c>0?Df:Db)*c*r];
}

// Bande souple posée sur le corps (sur le buste au-dessus de la taille, sur la jupe au-dessous).
function aliStrip(acc,path,width,off,rect,col,onSkirt=false){
  const steps=(path.length-1)*6;
  const at=t=>aliRow(path,t*(path.length-1));
  const P=(a,y)=>onSkirt||y<1.04?aliSkirt(a,y,off,false):aliTorso(a,y,off);
  aliGrid(acc,steps,1,(j,i)=>{const t=j/steps,[a,y]=at(t),[a2,y2]=at(Math.min(1,t+.01)),[a0,y0]=at(Math.max(0,t-.01));

    const N=new THREE.Vector3(c[0],0,c[2]-(y>1.3?-.005:0)).normalize(),B=new THREE.Vector3().crossVectors(T,N).normalize();

}

// Relief sculpté sur la projection frontale : arcades, orbites, nez, lèvres, menton, pommettes.
function aliRelief(x,y){
  const G=(cx,cy,sx,sy)=>Math.exp(-(((x-cx)/sx)**2)-((y-cy)/sy)**2),ax=Math.abs(x);
  let d=0;
  d+=.0055*Math.exp(-(((ax-.032)/.024)**2)-((y-.156)/.008)**2);            // arcades sourcilières
  d-=.0075*Math.exp(-(((ax-.031)/.016)**2)-((y-.137)/.009)**2);             // orbites
  d+=.0032*Math.exp(-(((ax-.031)/.011)**2)-((y-.135)/.006)**2);              // globe de l’œil
  d+=.0055*G(0,.150,.010,.010);                                            // racine du nez
  d+=Math.exp(-((x/.0085)**2))*.022*Math.max(0,Math.min(1,(.152-y)/.052))*Math.exp(-(((y-.100)/.034)**4)); // arête
  d+=.007*G(0,.097,.012,.008);                                             // pointe du nez
  d+=.006*Math.exp(-(((ax-.012)/.007)**2)-((y-.091)/.006)**2);               // ailes du nez
  d+=.0045*G(0,.078,.009,.008);                                            // philtrum
  d+=.0065*G(0,.067,.022,.0055)-.0018*G(0,.0605,.022,.0016);              // lèvre supérieure, commissure
  d+=.0070*G(0,.054,.019,.006);                                            // lèvre inférieure
  d-=.0022*G(0,.044,.016,.004);                                            // pli sous la lèvre
  d+=.0085*G(0,.026,.021,.011);                                            // menton
  d+=.0055*Math.exp(-(((ax-.050)/.018)**2)-((y-.113)/.016)**2);              // pommettes
  d-=.003*Math.exp(-(((ax-.045)/.012)**2)-((y-.072)/.02)**2);                // creux des joues
  return d;
}
function aliHeadPoint(a,y,off=0){
  const [,W,Df,Db,k,cz]=aliHeadAt(y),s=Math.sin(a),c=Math.cos(a);
  let x=W*s*(1-k*Math.max(0,c)**2),z=cz+(c>0?Df:Db)*c;
  if(c>0)z+=aliRelief(x,y)*Math.min(1,c*c*c*1.6);
  const nx=x/(W*W),nz=(z-cz)/((c>0?Df:Db)**2),ny=y>.2?(y-.2)*1.8:0,l=Math.hypot(nx,nz,ny)||1;
  return [x+off*nx/l,y+off*ny/l,z+off*nz/l];
}

    else if(T2.stare>0&&Math.hypot(g.position.x-P.x,g.position.z-P.z)<9){ U.arms[0].rotation.x=-0.3; U.arms[1].rotation.x=-0.3; U.body.position.y=0; U.body.rotation.x=0; }
    else { U.body.rotation.x*=0.9; if(U.cheer){ U.arms[0].rotation.x=-2.5+Math.sin(time*6+U.ph)*0.35; U.arms[1].rotation.x=-2.5+Math.cos(time*6+U.ph)*0.35; U.body.position.y=Math.abs(Math.sin(time*3+U.ph))*0.06; } else { U.arms[0].rotation.x=-1.0+Math.sin(time*9+U.ph)*0.25; U.arms[1].rotation.x=-1.0-Math.sin(time*9+U.ph)*0.25; } } }
  if(T2.stare>0) T2.stare-=dt;
  /* le crieur */
  { const U=fete.crier.userData; const up=toasting?1:0; U.arms[0].rotation.x+=((-2.9*up)-U.arms[0].rotation.x)*Math.min(1,dt*6); U.arms[1].rotation.x+=((-2.2*up)-U.arms[1].rotation.x)*Math.min(1,dt*6); }
  /* les comédiens hors de la farce */
  if(mode==="farce") farceTick(dt);
  else { const c1=fete.com1,c2=fete.com2;
    if(S.stage===12){ const a=time*0.8; c1.position.set(Math.cos(a)*2.3,1.0,-8.3+Math.sin(a)*1.0); c2.position.set(Math.cos(a-0.9)*2.3,1.0,-8.3+Math.sin(a-0.9)*1.0); c1.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a)*0.45); c2.rotation.y=Math.atan2(-Math.sin(a-0.9),Math.cos(a-0.9)*0.45); animate(c1,true,dt,8); animate(c2,true,dt,8); c2.userData.arms[1].rotation.x=-1.6+Math.sin(time*12)*0.6; }
    else { c1.position.set(-3.0,1.0,-8.2); c2.position.set(3.0,1.0,-8.6); faceTo(c1,-3,2,dt); faceTo(c2,3,2,dt); animate(c1,false,dt); animate(c2,false,dt); c1.userData.arms[0].rotation.x=-1.4+Math.sin(time*2)*0.6; c2.userData.arms[0].rotation.x=-1.0+Math.cos(time*2.3)*0.5; } }
  /* jongleurs, valet, pièces, zones */
  fete.jong.forEach((g,i)=>{ const a=time*0.2+i*0.3; g.position.set(Math.cos(a)*7.2,0,3+Math.sin(a)*7.2); g.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a)); animate(g,true,dt,7); g.userData.arms[0].rotation.x=-1.6; g.userData.arms[1].rotation.x=-1.6; g.userData.balls.forEach((b,k)=>{ const q=time*4+k*2.1+i; b.position.set(Math.sin(q)*0.3,2.15+Math.abs(Math.cos(q))*0.55,0.25); }); });
  const zj=fete.zones[3], mid=fete.jong[1].position; zj.x=mid.x; zj.z=mid.z;

  const zv=fete.zones[4]; zv.x=vx; zv.z=13.4;
  for(let i=0;i<28;i++){ const s=i*1.37, k=(time*0.6+s)%1; fete.coinPos[i*3]=vx+Math.cos(s*5)*2.6*k; fete.coinPos[i*3+1]=1.8+Math.sin(k*Math.PI)*1.6-k*1.6; fete.coinPos[i*3+2]=13.4+Math.sin(s*5)*2.6*k; } fete.coins.geometry.attributes.position.needsUpdate=true;
  for(const zn of fete.zones){ zn.m.position.set(zn.x,0.045,zn.z); zn.m.material.opacity=0.26+0.08*Math.sin(time*2.4+zn.r); }
  if(litter&&litter.visible){ litter.position.x=-24+cine2T*6.4; litter.position.y=Math.abs(Math.sin(time*3.4))*0.05; }

  if(S.stage===13&&(mode==="play"||mode==="dialog")){ const fw=player.rotation.y; [["garin",1],["maelle",-1]].forEach(([k,s])=>{ const g=N[k]; if(k==="maelle"&&!mJoin){ if(Math.hypot(g.position.x-P.x,g.position.z-P.z)<5) mJoin=true; else { g.userData.walking=false; return; } } const tx=P.x-Math.sin(fw)*1.5+Math.cos(fw)*0.9*s, tz=P.z-Math.cos(fw)*1.5-Math.sin(fw)*0.9*s; const dx=tx-g.position.x, dz=tz-g.position.z, d=Math.hypot(dx,dz), mv=d>0.35&&mode==="play";
      if(mv){ const sp=Math.min(d,(d>4?7:4.6)*dt); g.position.x+=dx/d*sp; g.position.z+=dz/d*sp; faceTo(g,tx,tz,dt,8); } g.userData.walking=mv; const c=g.userData.circle; c[0]=g.position.x; c[1]=g.position.z; c[3]=false; }); }
  else { N.garin.userData.walking=false; N.maelle.userData.walking=false; }

  if(mode==="play"&&S.stage>=11&&S.stage<=13){ const px=P.x,pz=P.z; let q=0,cx=0,cz=0; for(const zn of fete.zones){ const d=Math.hypot(px-zn.x,pz-zn.z); if(d<zn.r){ const k=1-d/zn.r; if(k>=q){ q=Math.max(k,0.001); cx=zn.x; cz=zn.z; } } }
    inZone=q>0; daze=Math.max(0,Math.min(1,daze+(inZone?dt*(0.12+0.22*q)*(S.mask?1.7:1):-dt*0.11)));
    if(inZone){ const d=Math.hypot(cx-px,cz-pz)||1, f=0.85*q*dt, nx=px+(cx-px)/d*f, nz=pz+(cz-pz)/d*f; if(!blocked(nx,nz)) player.position.set(nx,0,nz); }
    if(daze>=1){ daze=0; S.oubli=(S.oubli||0)+1; mode="turn"; sfx("halte"); endBig(); wash(()=>{ player.position.set(-6,0,15.6); if(S.stage===13){ mvN("garin",-5,15.0,0); N.garin.userData.circle[3]=false; if(mJoin){ mvN("maelle",-7,15.0,0); N.maelle.userData.circle[3]=false; } } snapCam(); mode="play"; refreshHud(); talk([["","Vous avez ri, bu, applaudi. Quand la musique s’éloigne, vous êtes assise au bord du quai, et la lune a tourné."],["","Vous aviez presque oublié pourquoi vous étiez sortie."]]); }); } }

let j2Miss=0;
function joute2(k,i,miss){ const J=J2[k]; if(i===0&&!miss) j2Miss=0;
  if(i>=J.rounds.length) return talk(J.end,()=>{ S.allies[k]=true; if(k==="maelle"){ setStage(12); startFarce(); } else { setStage(13); } save(); });

  talk([{head,choices:own.map(id=>[FEU[id].cit,()=>{ if(id===r.ok) talk([[J.who,r.rep]],()=>joute2(k,i+1)); else if(++j2Miss>=2){ j2Miss=0; talk([[J.who,"« Tu m’ennuies, Aliénor. Reviens quand tu sauras quoi dire. »"]]); } else joute2(k,i,true); }])}]); }

const LINE=["« Pauvres","et misérables","peuples insensés,","nations opiniâtres","en votre mal","et aveugles","à votre bien ! »"], LINE_ORD=[3,0,5,1,6,2,4];
function compose(n,miss){ if(n>=LINE.length) return press(0);
  const head=`<div class="who">La casse d’imprimerie</div><p class="more">Composez la ligne : touchez les mots dans l’ordre de la page.</p><p class="txt" style="min-height:2.6em;border-bottom:2px solid var(--ink);padding-bottom:4px">${esc(LINE.slice(0,n).join(" "))||"&nbsp;"}</p>${miss?`<p class="more">Ce mot ne vient pas là. ${n===0?"La page commence par « Pauvres ».":""}</p>`:""}`;
  talk([{head,choices:LINE_ORD.filter(i=>i>=n).map(i=>[LINE[i],()=>{ if(i===n){ sfx("type"); compose(n+1); } else compose(n,true); }])}]); }

// B-2 · à la porte du palais
function bastienPorte(){ const b=bstate(), t=S.flags.tribut, atPoterne=S.act===1&&S.stage===4&&!b.b3&&!b.refus;
  const base=()=>talk([[atPoterne?GD:bsp(),vary("gd",["« Circule. On ne regarde pas la porte. On regarde ses pieds. »","« Moi aussi, je paie le tribut. On me le retient sur la solde. »","« Mon frère est dans la file. Je fais semblant de ne pas le voir. Lui aussi. »"])]]);
  if(S.stage<2||b.refus||b.b2||atPoterne||(t!=="refus"&&t!=="denonce")) return base();
  b.b2=true; save();
  if(t==="refus") return talk([[bsp(),"« Toi, la question. Tu sais ce qu’il a écrit, sous ton nom ? Moi non plus. Je ne sais pas ce qu’on écrit sur les gens. »"],{choices:[
    ["« Comment tu t’appelles ? »",()=>{ b.nom=true; bz(1,0); talk([[BAS,"« Ici, on m’appelle « le garde ». Chez moi, Bastien. »"]]); }],
    ["« Et toi, tu ne demandes jamais ? »",()=>{ bz(1,0); talk([[bsp(),"« Moi aussi, je paie le tribut. On me le retient sur la solde. »"],[bsp(),"« Demander, c’est un luxe. »"]]); }],
    ["« Laisse-moi passer. »",()=>talk([[bsp(),"« Circule. On ne regarde pas la porte. On regarde ses pieds. »"]])]]}]);
  talk([[bsp(),"« Tu regardes le sac des autres. Moi, je regarde mes pieds. Chacun son métier. »"],{choices:[
    ["« J’ai eu peur. »",()=>{ bz(1,0); talk([[bsp(),"« Tout le monde a peur. Tout le monde ne donne pas un nom. »"]]); }],
    ["Passer votre chemin",()=>talk([["","Vous passez. Il regarde de nouveau ses pieds."]])]]}]); }
// B-3 · la poterne
function bastienPoterne(caught){ const b=bstate(); b.b3=true; save();
  const open=caught?[["","Le garde qui vous raccompagne, c’est celui de la porte du palais."],[bsp(),"« Ne cours pas. Ceux qui courent, on les rattrape. »"]]
    :[["","Contre le battant ouvert de la poterne, un garde est assis, un morceau de pain à la main. Son casque est posé à côté de lui."],[bsp(),"« Je n’ai rien vu. Comme toujours. »"]];
  talk(open.concat([{choices:[
    ["« Je cherchais un chat. »",()=>talk([[bsp(),"« Ça marche une fois. »"],["","Il sourit."]],placeExtras)],
    ["« Je cherchais quelque chose qu’on m’a pris. »",()=>{ bz(1,1); talk([[bsp(),"« Ici, on a tous quelque chose qu’on nous a pris. »"]],placeExtras); }],
    ["« Pourquoi tu me laisses partir ? »",()=>{ bz(1,0); const had=b.nom; b.nom=true; save(); talk([[BAS,"« Parce que ma mère passe par là, le matin. Si je ferme, elle ne passe plus. »"]].concat(had?[]:[[BAS,"« Bastien. Pour toi. »"]]),placeExtras); }],
    ["« Laisse-moi tranquille. »",()=>{ b.refus=true; save(); talk([[bsp(),"« D’accord. »"],["","Il remet son casque."]],placeExtras); }],
    ["Partir sans répondre",()=>talk([["","Vous repartez sans un mot."]],placeExtras)]]}])); }
// B-4 · le branle
function bastienBranle(){ const b=bstate(); b.b4=true; save();
  talk([[bsp(),"« Ce soir, je n’ai pas de hallebarde. Tu danses ? »"],{choices:[
    ["Danser",()=>{ b.danse=true; bz(1,0); daze=Math.min(0.92,daze+0.25); talk([["","Le branle vous prend. Les mains se prennent et se lâchent, la ronde tourne, les lanternes aussi."],["","Au dernier tour, il ne lâche pas votre main tout de suite."],["","La tête vous tourne un peu. La fête vous prend plus vite."]],placeExtras); }],
    ["« Pas ce soir. J’ai quelque chose à faire. »",()=>talk([[bsp(),"« Alors fais-le bien. »"]],placeExtras)],
    ["« Je ne danse pas avec la garde. »",()=>{ bz(-1,0); talk([[bsp(),"« Je comprends. »"]],placeExtras); }]]}]); }
// B-6 · l'affiche
function bastienAube(){ const b=bstate(); b.b6=true; save();
  talk([["",b.nom?"Près de la fontaine, Bastien lit l’affiche, lentement, en suivant les lignes du doigt.":"Près de la fontaine, un garde lit l’affiche, lentement, en suivant les lignes du doigt."],{choices:[
    ["« Tu sais lire ? »",()=>{ b.lit=true; bz(1,0); talk([[bsp(),"« Un peu. J’ai appris sur les édits de la porte. Ne le dis à personne : un garde qui lit, ça se remarque. »"]]); }],
    ["« Merci, pour cette nuit. »",()=>{ bz(1,1); talk([[bsp(),"« Je n’ai rien vu. »"],["","Un temps."],[bsp(),"« Fais attention. Les lendemains de fête, ils comptent ceux qui manquent. »"]]); }],
    ["« Tu vas l’arracher ? »",()=>talk([[bsp(),"« On ne m’a rien ordonné. »"],["","Il ne l’arrache pas."]])],
    ["Passer sans rien dire",()=>talk([["","Vous passez. Derrière vous, il reprend sa lecture au début."]])]]}]); }
// M-2 · la femme masquée
function mahautBillet(){ const m=mstate(); m.billet=true; save();
  talk([["","La femme masquée vous regarde approcher. Puis elle se détourne et se perd dans la foule, avec le vieil homme."],["","Sur la margelle, elle a laissé un billet plié."],["","Ce n’est pas imprimé. C’est écrit à la main, d’une écriture penchée, à l’encre brune :"],["","« Soyez résolus de ne plus servir et vous voilà libres. »"],["","Vous rangez le billet dans votre carnet."]],placeExtras); }
function billetHTML(){ return S.mahaut&&S.mahaut.billet?`<div class="feuil"><span class="kick">Un billet écrit à la main</span><div class="cit">« Soyez résolus de ne plus servir et vous voilà libres. »</div><p class="small">Laissé sur la margelle de la fontaine par une femme masquée, le soir de la fête. Encre brune, écriture penchée. Ce n’est pas un feuillet imprimé. Édition Belin, p. 27.</p></div>`:""; }
const basLabel=()=>bstate().nom?"Parler à Bastien":"Parler au garde";
INTER.push({p:()=>BAS_ARM.position,r:2.3,get label(){ return basLabel(); },can:()=>BAS_ARM.visible&&(S.act===1?!bstate().b3:!bstate().b6),act(){ if(S.act===1) bastienPoterne(false); else bastienAube(); }});
INTER.push({p:()=>BAS_OFF.position,r:2.3,get label(){ return basLabel(); },can:()=>BAS_OFF.visible&&!bstate().b4,act(){ bastienBranle(); }});
INTER.push({p:()=>MAHAUT.position,r:2.6,label:"S’approcher de la femme masquée",can:()=>MAHAUT.visible,act(){ mahautBillet(); }});

/* ================= Son : enregistrements réels (dossier son/), mixés et spatialisés dans la page =================
   Musiques, ambiances et bruitages générés avec ElevenLabs. Les musiques et les ambiances ne sont décodées
   qu’au moment où on les entend, puis libérées, pour ménager la mémoire de l’iPad. */
const Snd={ctx:null,buf:{},loading:{},last:{},amb:{},mus:[],musKey:"",want:"",lastPh:0,alt:{},laughT:9,clinkT:4,owlT:16,bellT:40,gcT:0,stepI:0};
const SFX_FILES=["page","feuillet","pieces","pierre","presse","colle","type","cloche","rires","applaudissements","acclamation","trinquer","halte","porte","chouette","murmure","sac","plume","bois","pas-0","pas-1","pas-2","pas-3","pas-4","pas-5","armure-0","armure-1","armure-2","armure-3","armure-4"];
/* gap : silence entre deux passages du morceau (négatif : fondu enchaîné, pour la musique jouée sur la place) */
const MUSIC={titre:{gap:5,vol:.85},jour:{gap:8,vol:.5},cour:{gap:3,vol:.62},branle:{gap:-4,vol:.8,files:["mus-branle","mus-ronde"]} /* la fête : gaillarde et ronde en alternance */,farce:{gap:-3,vol:.8},nuit:{gap:6,vol:.62},aube:{gap:6,vol:.7},fanfare:{gap:-3,vol:.85},litiere:{gap:-4,vol:.8}};
const AMBS=["marche","fontaine","quai","cour","chapelle","atelier","fete","nuit","aube","ruelle","feu","vent","pluie"];

function sndLoad(name){ const c=Snd.ctx; if(!c) return null; Snd.last[name]=c.currentTime; if(Snd.buf[name]) return Snd.buf[name]; if(Snd.loading[name]) return null;
  Snd.loading[name]=true;
  fetch("son/"+name+".mp3").then(r=>{ if(!r.ok) throw Error(r.status); return r.arrayBuffer(); })
    .then(bytes=>new Promise((ok,ko)=>{ const p=c.decodeAudioData(bytes,ok,ko); if(p&&p.catch) p.catch(ko); }))
    .then(b=>{ Snd.buf[name]=b; Snd.loading[name]=false; Snd.last[name]=c.currentTime; })
    .catch(()=>{ setTimeout(()=>{ Snd.loading[name]=false; },8000); });
  return null; }

function initAudio(){ if(Snd.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const c=new AC(); Snd.ctx=c;
  Snd.master=c.createGain(); Snd.master.gain.value=S.mute?0:0.9; const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; Snd.master.connect(comp); comp.connect(c.destination);
  Snd.bus=c.createGain(); Snd.bus.connect(Snd.master);
  /* la musique de la fête passe par un filtre : loin des lumières, elle s’étouffe comme derrière un mur */
  Snd.mlp=c.createBiquadFilter(); Snd.mlp.type="lowpass"; Snd.mlp.frequency.value=16000; Snd.mlp.Q.value=0.5; Snd.mbus=c.createGain(); Snd.mbus.connect(Snd.mlp); Snd.mlp.connect(Snd.bus);
  /* la foule aussi */
  Snd.clp=c.createBiquadFilter(); Snd.clp.type="lowpass"; Snd.clp.frequency.value=16000; Snd.crowd=c.createGain(); Snd.crowd.connect(Snd.clp); Snd.clp.connect(Snd.bus);
  Snd.abus=c.createGain(); Snd.abus.connect(Snd.bus);
  for(const n of SFX_FILES) sndLoad(n); }

/* ---------- bruitages ---------- */
function pan(x){ return Math.max(-1,Math.min(1,(x-player.position.x)/10)); }
function playSfx(name,vol,panV,rate,dest,delay){ const c=Snd.ctx; if(!c||c.state!=="running") return false; const b=sndLoad(name); if(!b) return false;
  const s=c.createBufferSource(); s.buffer=b; s.playbackRate.value=rate||1; const g=c.createGain(); g.gain.value=vol; s.connect(g); let o=g;
  if(panV&&c.createStereoPanner){ o=c.createStereoPanner(); o.pan.value=Math.max(-1,Math.min(1,panV)); g.connect(o); }
  o.connect(dest||Snd.bus); s.start(c.currentTime+0.005+(delay||0)); s.onended=()=>{ s.disconnect(); g.disconnect(); if(o!==g) o.disconnect(); }; return true; }
const vary2=(a,b)=>a+Math.random()*(b-a);
function stepSound(x,z,vol,metal){ const d=Math.hypot(x-player.position.x,z-player.position.z), g=vol/(1+d*d/30); if(g<0.01) return;
  Snd.stepI=(Snd.stepI+1+((Math.random()*3)|0))%(metal?5:6);
  playSfx((metal?"armure-":"pas-")+Snd.stepI,g,pan(x),vary2(0.93,1.07)); }
function sfx(k){ const c=Snd.ctx; if(!c||c.state!=="running") return;
  if(k==="page") playSfx("page",0.75,0,vary2(0.95,1.05));
  else if(k==="feuillet") playSfx("feuillet",0.9);
  else if(k==="halte") playSfx("halte",0.9);
  else if(k==="stone") playSfx("pierre",1.0);
  else if(k==="laugh") playSfx("rires",0.8,vary2(-0.4,0.4),vary2(0.94,1.06),Snd.crowd);
  else if(k==="laughBig"){ playSfx("rires",1.0,-0.25,1,Snd.crowd); playSfx("rires",0.7,0.3,0.92,Snd.crowd,0.18); }
  else if(k==="applause") playSfx("applaudissements",1.0,0,1,Snd.crowd);
  else if(k==="vive"){ playSfx("acclamation",1.0,-0.15,1,Snd.crowd); playSfx("acclamation",0.6,0.3,0.94,Snd.crowd,0.09); }
  else if(k==="murmur") playSfx("murmure",0.8,0,1,Snd.crowd);
  else if(k==="clinks"){ for(let i=0;i<4;i++) playSfx("trinquer",vary2(0.25,0.5),vary2(-0.8,0.8),vary2(0.9,1.12),Snd.bus,i*vary2(0.12,0.3)); }
  else if(k==="clink1") playSfx("trinquer",0.7);
  else if(k==="coins") playSfx("pieces",0.9);
  else if(k==="type") playSfx("type",0.8,0,vary2(0.95,1.05));
  else if(k==="press") playSfx("presse",0.9,0,vary2(0.96,1.03));
  else if(k==="glue") playSfx("colle",0.9);
  else if(k==="sac") playSfx("sac",0.85);
  else if(k==="plume") playSfx("plume",0.7);
  else if(k==="porte") playSfx("porte",0.8);
  else if(k==="bois") playSfx("bois",0.7);
  else if(k==="minuit"){ for(let i=0;i<12;i++) playSfx("cloche",0.75,0,1,Snd.bus,0.4+i*1.8); } }

/* ---------- la musique : un morceau par moment du récit ---------- */
function musicNow(){ if(mode==="plate"||mode==="turn"||mode==="title") return "titre";
  if(S.act===2){ if(mode==="cine2") return "litiere"; if(mode==="farce") return "farce"; if(T2.on) return "fanfare"; const s=S.stage;
    if(s>=15) return "aube"; if(s===14||s===10) return "nuit";
    if(s===12&&Math.hypot(player.position.x,player.position.z+6)<10) return "farce"; return "branle"; }
  if(mode==="cine") return "aube"; return zoneOf()==="cour"?"cour":"jour"; }
function feteDist(){ return Math.hypot(player.position.x,player.position.z+2); }
function muffleHz(){ if(!(S.act===2&&night&&S.stage>=11&&S.stage<=13)||mode==="farce"||mode==="plate"||mode==="turn"||mode==="title") return 16000; const d=feteDist(); return d<11?16000:Math.max(560,16000*Math.pow(0.82,d-11)); }
const musName=(key,off)=>{ const f=MUSIC[key].files; return f?f[((Snd.alt[key]||0)+(off||0))%f.length]:"mus-"+key; };
function musStart(key,at,fadeIn,name){ const c=Snd.ctx, b=Snd.buf[name]; const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); s.connect(g); g.connect(Snd.mbus);
  const v=MUSIC[key].vol; g.gain.setValueAtTime(fadeIn?0.0001:v,at); if(fadeIn) g.gain.linearRampToValueAtTime(v,at+fadeIn);
  s.start(at); const m={key,name,s,g,at,end:at+b.duration}; s.onended=()=>{ s.disconnect(); g.disconnect(); Snd.mus=Snd.mus.filter(x=>x!==m); }; Snd.mus.push(m); return m; }
/* le morceau suivant : pour la fête, on passe de la gaillarde à la ronde et inversement */
function musNext(key){ const n=musName(key,1); if(n!==musName(key)&&Snd.buf[n]){ Snd.alt[key]=(Snd.alt[key]||0)+1; return n; } return musName(key); }
function musTick(){ const c=Snd.ctx, now=c.currentTime, key=musicNow();
  if(key!==Snd.musKey){ for(const m of Snd.mus){ if(m.key===Snd.musKey||m.key!==key){ m.g.gain.cancelScheduledValues(now); m.g.gain.setTargetAtTime(0.0001,now,0.8); try{ m.s.stop(now+4); }catch(e){} m.dead=true; } } Snd.musKey=key; Snd.musNext=0; }
  if(!key) return;
  if(!sndLoad(musName(key))) return; sndLoad(musName(key,1)); const cfg=MUSIC[key], live=Snd.mus.filter(m=>m.key===key&&!m.dead);
  if(!live.length){ if(!Snd.musNext){ const m=musStart(key,now+0.05,2.5,musName(key)); Snd.musNext=m.end+cfg.gap; } else if(now>=Snd.musNext-0.3){ const m=musStart(key,Math.max(now+0.05,Snd.musNext),cfg.gap<0?-cfg.gap:0.05,musNext(key)); Snd.musNext=m.end+cfg.gap; } return; }
  const cur=live[live.length-1];
  if(cfg.gap<0&&now>=cur.end+cfg.gap-0.4&&cur.end+cfg.gap>now-0.5){ if(!cur.chained){ cur.chained=true; const x=-cfg.gap; cur.g.gain.setValueAtTime(cfg.vol,cur.end-x); cur.g.gain.linearRampToValueAtTime(0.0001,cur.end); const m=musStart(key,Math.max(now+0.02,cur.end-x),x,musNext(key)); Snd.musNext=m.end+cfg.gap; } }
  else if(cfg.gap>=0) Snd.musNext=cur.end+cfg.gap; }

/* ---------- ambiances : chaque lieu a sa nappe, mêlée selon la place d’Aliénor ---------- */
function ambSet(name,level,panV){ const c=Snd.ctx, now=c.currentTime; let L=Snd.amb[name];
  if(!L){ if(level<0.002) return; L=Snd.amb[name]={g:c.createGain(),p:c.createStereoPanner?c.createStereoPanner():null,src:null,zero:0}; L.g.gain.value=0; if(L.p){ L.g.connect(L.p); L.p.connect(Snd.abus); } else L.g.connect(Snd.abus); }
  if(level>0.002){ L.zero=0; const b=sndLoad("amb-"+name); if(b&&!L.src){ const s=c.createBufferSource(); s.buffer=b; s.loop=true; s.connect(L.g); s.start(now+0.02,Math.random()*b.duration); L.src=s; } }
  else if(!L.zero) L.zero=now;
  L.g.gain.setTargetAtTime(L.src?level:0,now,0.6); if(L.p&&panV!==undefined) L.p.pan.setTargetAtTime(panV,now,0.3);
  if(L.src&&L.zero&&now-L.zero>12){ try{ L.src.stop(); }catch(e){} L.src.disconnect(); L.src=null; } }
function ambient(dt){ const c=Snd.ctx, now=c.currentTime, P=player.position, inGame=mode!=="title", fete2=S.act===2&&night&&!!fete;
  const opening=sceneRun&&sceneRun.name==="matin";
  Snd.mbus.gain.setTargetAtTime(opening?(sceneRun.t<5?.25:.5):(mode==="dialog"||mode==="sequence"?.55:1)*(Snd.musKey==="cour"?0.75+0.5*seen:1),now,.32);
  const mf=muffleHz(); Snd.mlp.frequency.setTargetAtTime(mf,now,0.3); Snd.clp.frequency.setTargetAtTime(Math.min(16000,mf*1.6),now,0.3);
  Snd.abus.gain.setTargetAtTime(mode==="plate"||mode==="turn"?0.35:(mode==="dialog"?0.8:1),now,0.5);
  const cl=v=>Math.max(0,Math.min(1,v)), dAt=(x,z)=>Math.hypot(P.x-x,P.z-z);
  const cour=cl((P.x-22)/4), chap=cl(1-dAt(52.7,-2)/9), act2Day=S.act===2&&!night;
  const lv={};
  if(!inGame){ lv.vent=0.35; lv.fontaine=0.3; lv.nuit=0.25; }
  else {
    lv.vent=0.12+0.35*weather+(night?0.08:0)+cour*0.08;
    lv.pluie=weather*0.9;
    lv.quai=0.9*cl((P.z-4)/12)*(1-cour);
    lv.fontaine=0.85*cl(1-dAt(0,3)/12);
    lv.cour=cour*(night?0.55:0.85)*(1-chap*0.6);
    lv.chapelle=chap*0.9;
    lv.atelier=S.stage===14?0.85:0.7*cl(1-dAt(ATELIER.x,ATELIER.z)/6);
    if(night){ lv.nuit=0.65*(fete2&&S.stage>=11&&S.stage<=13?cl((feteDist()-8)/18):1); }
    else if(dawn||act2Day){ lv.aube=0.75; lv.ruelle=0.2; }
    else { lv.ruelle=0.35*(1-cour); lv.marche=S.act!==2?(S.stage<5?0.85:0.5)*(1-cour)*(0.45+0.55*cl(1-dAt(-2,-2)/22)):0; }
    if(fete2&&S.stage>=10&&S.stage<=14){ let f=S.stage===14?0.12:(S.stage===10?0.3:0.95*Math.max(0.15,cl(1-(feteDist()-5)/26))); if(mode==="cine2") f*=0.15; if(T2.on) f*=1.2; lv.fete=f;
      let dm=99, lx=0; for(const l of fete.lights){ const d=dAt(l.position.x,l.position.z); if(d<dm){ dm=d; lx=l.position.x; } } lv.feu=0.75*cl(1-dm/8); Snd.feuX=lx; }
    if(opening) lv.quai=Math.max(lv.quai,0.6*(1-ease01((sceneRun.t-2.2)/3.5)));
  }
  for(const n of AMBS) ambSet(n,lv[n]||0,n==="fontaine"?pan(0)*0.6:(n==="feu"?pan(Snd.feuX||0)*0.5:undefined));
  /* la vie qui passe : rires et gobelets à la fête, chouette la nuit, cloche le matin */
  if(fete2&&S.stage>=11&&S.stage<=13&&mode==="play"){ Snd.laughT-=dt; Snd.clinkT-=dt; const near=S.stage===12&&Math.hypot(P.x,P.z+6)<11;
    if(Snd.laughT<=0){ Snd.laughT=(near?6:11)+Math.random()*(near?5:12); playSfx("rires",(near?0.7:0.4)*Math.max(0.25,1-feteDist()/30),vary2(-0.6,0.6),vary2(0.9,1.1),Snd.crowd); }
    if(Snd.clinkT<=0){ Snd.clinkT=4+Math.random()*6; const g=fete.crowd[(Math.random()*fete.crowd.length)|0], d=Math.hypot(g.position.x-P.x,g.position.z-P.z); if(d<16) playSfx("trinquer",0.45*(1-d/16),pan(g.position.x),vary2(0.9,1.12)); } }
  if(night&&inGame&&(feteDist()>16||S.stage===14||mode==="cine2")){ Snd.owlT-=dt; if(Snd.owlT<=0){ Snd.owlT=18+Math.random()*20; playSfx("chouette",0.35,vary2(-0.7,0.7),vary2(0.96,1.04)); } }
  if(!night&&!dawn&&inGame&&S.act!==2&&mode==="play"){ Snd.bellT-=dt; if(Snd.bellT<=0){ Snd.bellT=80+Math.random()*60; playSfx("cloche",0.22,-0.5,1.25); } }
  /* mémoire : on libère ce qu’on n’entend plus */
  Snd.gcT-=dt; if(Snd.gcT<=0){ Snd.gcT=5; for(const n in Snd.buf){ if(!(n.startsWith("mus-")||n.startsWith("amb-"))) continue; const k=n.slice(4);
    if(n.startsWith("mus-")&&Snd.mus.some(m=>m.name===n)) continue; if(n.startsWith("amb-")&&Snd.amb[k]&&Snd.amb[k].src) continue;
    if(now-(Snd.last[n]||0)>40) delete Snd.buf[n]; } } }
function soundTick(dt){ if(!Snd.ctx||Snd.ctx.state!=="running") return; ambient(dt); musTick();
  const U=player.userData, k=Math.floor(U.ph/Math.PI); if(k!==Snd.lastPh){ Snd.lastPh=k; if(U.amp>0.35) stepSound(player.position.x,player.position.z,0.55); }
  for(const o of guards){ if(!o.g.visible) continue; const u=o.g.userData, kk=Math.floor(u.ph/Math.PI); if(kk!==u.lastStep){ u.lastStep=kk; if(u.amp>0.35) stepSound(o.g.position.x,o.g.position.z,0.5,true); } } }

function unlock(){ try{ initAudio(); if(Snd.ctx&&Snd.ctx.state==="suspended"&&!document.hidden) Snd.ctx.resume(); }catch(e){} }
for(const ev of ["pointerup","click","keydown","touchend"]) window.addEventListener(ev,unlock,{passive:true});
document.addEventListener("visibilitychange",()=>{ if(!Snd.ctx) return; try{ if(document.hidden) Snd.ctx.suspend(); else Snd.ctx.resume(); }catch(e){} });
const sndBtn=$("snd");
function sndIcon(){ sndBtn.innerHTML=`<svg viewBox="0 0 30 30" fill="none" stroke="#221f2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 22 L11 7 L23 4.5 L23 19.5"/><ellipse cx="8" cy="22.4" rx="3.3" ry="2.5" fill="#221f2b"/><ellipse cx="20" cy="19.9" rx="3.3" ry="2.5" fill="#221f2b"/>${S.mute?`<path d="M4 4 L26 27" stroke="#a9583a" stroke-width="2.6"/>`:""}</svg>`; sndBtn.setAttribute("aria-label",S.mute?"Remettre la musique":"Couper la musique"); }
sndBtn.addEventListener("click",()=>{ S.mute=!S.mute; save(); unlock(); if(Snd.ctx) Snd.master.gain.setTargetAtTime(S.mute?0:0.9,Snd.ctx.currentTime,0.06); sndIcon(); });

/* ================= Premier plan : branche et roseaux à l'encre ================= */
{ let sd=5; const r=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  const cols=["#1c2444","#2e3a66","#26315a","#3b4a7a","#2f6b78","#1c2444"];
  const blot=(x,y,rad,c,o)=>`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(rad*(0.7+r()*0.6)).toFixed(1)}" ry="${(rad*(0.42+r()*0.45)).toFixed(1)}" transform="rotate(${(r()*180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${c}" opacity="${o}"/>`;
  const cluster=(cx,cy,n,sp,rad)=>{ let o=""; for(let i=0;i<n;i++){ const a=r()*6.283, d=Math.sqrt(r())*sp; o+=blot(cx+Math.cos(a)*d,cy+Math.sin(a)*d*0.7,rad*(0.55+r()*0.8),cols[(r()*cols.length)|0],(0.5+r()*0.42).toFixed(2)); } for(let i=0;i<n/3;i++){ const a=r()*6.283, d=sp*(1.0+r()*0.7); o+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d*0.8).toFixed(1)}" r="${(0.8+r()*2.2).toFixed(1)}" fill="#1c2444" opacity=".7"/>`; } return o; };
  const wet=id=>`<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter>`;
  const fall=[[250,190,"#e07f2a"],[330,170,"#a9583a"],[120,210,"#d6a94e"],[400,200,"#a9583a"]].map(q=>`<path d="M0 0 C5 -7 14 -7 19 0 C14 7 5 7 0 0 Z" fill="${q[2]}" stroke="#221f2b" stroke-width=".8" transform="translate(${q[0]} ${q[1]}) rotate(${(r()*180).toFixed(0)})"/>`).join("");
  const tr=`<svg class="tr" viewBox="0 0 460 250">${wet("wetA")}<g class="sway"><path d="M466 4 C380 20 290 38 216 92 C182 116 150 128 108 160 M320 44 C312 82 292 104 268 136 M252 66 C218 60 196 42 160 38 M216 92 C208 126 190 156 190 192 M400 22 C404 60 418 86 436 112" fill="none" stroke="#191d33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M466 4 C404 14 350 26 306 44" fill="none" stroke="#191d33" stroke-width="10" stroke-linecap="round"/><g filter="url(#wetA)">${cluster(380,34,26,62,17)}${cluster(280,84,26,58,16)}${cluster(196,128,22,52,15)}${cluster(156,44,20,48,14)}${cluster(118,164,14,36,12)}${cluster(430,112,18,40,14)}${cluster(190,196,12,30,11)}</g>${fall}</g></svg>`;
  const tl=`<svg class="tl" viewBox="0 0 300 240">${wet("wetB")}<g class="sway" style="transform-origin:0 0;animation-delay:-3s"><path d="M-6 6 C50 20 96 44 132 86 C150 106 176 116 206 136 M70 30 C76 66 96 90 112 118 M132 86 C128 116 138 140 136 168" fill="none" stroke="#191d33" stroke-width="5" stroke-linecap="round"/><path d="M-6 6 C30 12 58 22 84 38" fill="none" stroke="#191d33" stroke-width="10" stroke-linecap="round"/><g filter="url(#wetB)">${cluster(40,40,24,56,17)}${cluster(112,112,20,46,15)}${cluster(196,132,16,40,13)}${cluster(136,170,12,30,11)}</g></g></svg>`;
  let reeds=""; [[36,92,18,60],[70,60,40,96],[104,120,30,74],[140,150,22,50],[18,150,-10,44],[176,190,18,34]].forEach((q,i)=>{ const x=q[0],top=q[1],bend=q[2]; reeds+=`<g class="reed" style="animation-delay:${-i*0.9}s"><path d="M${x} 262 C${x+bend*0.2} 200 ${x+bend*0.6} ${top+60} ${x+bend} ${top}" stroke="#191d33" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${x+2} 262 C${x+bend*0.5+14} 210 ${x+bend+26} ${top+q[3]+40} ${x+bend+38} ${top+q[3]} C${x+bend+18} ${top+q[3]+50} ${x+bend*0.4+6} 222 ${x+2} 262 Z" fill="${cols[i%5]}" opacity=".78"/>${i%2?"":`<ellipse cx="${x+bend}" cy="${top+10}" rx="5" ry="15" fill="#3a2a22" transform="rotate(${bend*0.4} ${x+bend} ${top+10})"/>`}</g>`; });
  fgEl.innerHTML=tr+tl+`<svg class="bl" viewBox="0 0 300 262">${reeds}</svg>`; }

/* ================= Démarrage ================= */
function start(d){ if(d&&d.started!==undefined) S=Object.assign(fresh(),d); else load();
  player.position.set(S.pos[0],0,S.pos[1]); if(blocked(S.pos[0],S.pos[1])) player.position.set(-19,0,7);
  resize(); applyStage(); sndIcon(); showTitle(); tick(); }
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>{save();return S;});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
